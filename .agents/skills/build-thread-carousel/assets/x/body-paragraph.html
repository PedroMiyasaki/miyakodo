<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arquétipo · body-paragraph - Reel (modo X)</title>
<link rel="stylesheet" href="_carousel.css">
<style>
  /*
     Archetype: body-paragraph
     When to use: the middle and last stills (T2 through T(N)).

     Regular 30px text, rich formatting encouraged.
     "→ " as an inline list marker, with a paragraph break between items.
  */
  .slide-body .tweet-text {
    font-size: 30px;
    font-weight: 400;
    line-height: 1.4;
    letter-spacing: -0.005em;
  }
  .slide-body .tweet-text > p { margin: 0 0 0.85em 0; }
  .slide-body .tweet-text > p:last-child { margin-bottom: 0; }
</style>
</head>
<body class="carrossel-preview">

<section class="slide slide-body">
  <header class="profile-row">
    <div class="identity">
      <div class="name-line">
        <!-- PNG horizontal 3: off-white #f6f4ee. Cor por arquivo: tabela em design/identity.md. -->
        <img class="logo" src="../../../../../design/logo/png/horizontal/MIYAKODO_HORIZONTAL3.png" alt="Miyakodo">
        <span class="display-name">Pedro Miyasaki</span>
      </div>
      <div class="bio">@pedro.miyasaki.ia</div>
    </div>
  </header>

  <div class="tweet-text">
    <p>Pensa comigo:</p>
    <p>→ Primeiro item da lista, com quebra de parágrafo entre os itens.</p>
    <p>→ Segundo item, mantendo o ritmo de leitura.</p>
    <p>→ Terceiro item fecha o ponto.</p>
    <p>Dá para fechar com <strong>uma frase-chave em negrito</strong> para dar peso visual.</p>
  </div>

  <!-- Optional: media block.
       <div class="tweet-media">
         <img src="{{IMAGE_URL}}" alt="Description">
       </div>
  -->
</section>

</body>
</html>

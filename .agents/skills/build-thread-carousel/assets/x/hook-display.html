<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arquétipo · hook-display - Reel (modo X)</title>
<link rel="stylesheet" href="_carousel.css">
<style>
  /*
     Archetype: hook-display
     When to use: the first still of the reel (T1).

     The first paragraph becomes an Instrument Serif headline, 40px, regular weight.
     The remaining paragraphs are Poppins, 30px.
  */
  .slide-hook .tweet-text > p:first-child {
    font-family: var(--font-serif);
    font-size: 40px;
    font-weight: 400;
    line-height: 1.22;
    letter-spacing: -0.015em;
    margin: 0 0 28px 0;
  }
  .slide-hook .tweet-text > p:not(:first-child) {
    font-size: 30px;
    font-weight: 400;
    line-height: 1.4;
    margin: 0 0 0.85em 0;
    letter-spacing: -0.005em;
  }
  .slide-hook .tweet-text > p:last-child { margin-bottom: 0; }
</style>
</head>
<body class="carrossel-preview">

<section class="slide slide-hook">
  <header class="profile-row">
    <div class="identity">
      <div class="name-line">
        <!-- PNG horizontal 3: off-white #f6f4ee. Cor por arquivo: tabela em design/identity.md. -->
        <img class="logo" src="../../../../../design/logo/png/horizontal/MIYAKODO_HORIZONTAL3.png" alt="Miyakodo">
        <span class="display-name">Pedro Miyasaki</span>
      </div>
      <div class="bio">@pedro.miyasaki.ia</div>
    </div>
  </header>

  <div class="tweet-text">
    <p>Uma headline direta e forte que vira a pergunta central da thread.</p>
    <p>Um parágrafo de body em peso regular dá contexto à headline ou estica ela.</p>
  </div>

  <!-- Optional: media block. Omit the whole div if there is no image.
       <div class="tweet-media">
         <img src="{{IMAGE_URL}}" alt="Description">
       </div>
  -->
</section>

</body>
</html>

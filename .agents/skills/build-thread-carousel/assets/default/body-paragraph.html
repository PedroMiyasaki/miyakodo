<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Arquétipo · body-paragraph</title>
<link rel="stylesheet" href="_carousel.css">
<style>
  /* ============================================================
     Archetype: body-paragraph
     ============================================================
     When to use: the middle AND last slides (T2 through T(N)).
     The workhorse of the carousel.

     Structure: profile-row + tweet-text with regular-weight
     paragraphs, everything vertically centered. Optionally a
     .tweet-media below the text.

     Encourages rich formatting (more than the original thread):
     - **bold** on a key sentence
     - *italics* on a highlighted term
     - `code` on technical terms
     - > quote pulls out an important sentence
     - "→ " as an inline list marker, with a paragraph break
       between items

     No hard character limit on the carousel - the IG post can be
     more formatted than the original tweet, with more spacing
     and structure.
  */
  .slide-body .tweet-text {
    font-size: 30px;
    font-weight: 400;
    line-height: 1.4;
    letter-spacing: -0.005em;
  }
  .slide-body .tweet-text > p { margin: 0 0 0.85em 0; }
  .slide-body .tweet-text > p:last-child { margin-bottom: 0; }
</style>
</head>
<body class="carrossel-preview">

<section class="slide slide-body">
  <header class="profile-row">
    <div class="identity">
      <div class="name-line">
        <span class="display-name">Pedro Miyasaki</span>
        <svg class="verified" viewBox="0 0 24 24" aria-label="Verified account" role="img">
          <g>
            <path fill="#1d9bf0" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z"/>
            <path fill="#ffffff" d="M10.54 16.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/>
          </g>
        </svg>
      </div>
      <div class="bio">@pedro.miyasaki.ia</div>
    </div>
  </header>

  <div class="tweet-text">
    <p>Pensa comigo:</p>
    <p>→ Primeiro item da lista, com quebra de parágrafo entre os itens.</p>
    <p>→ Segundo item, mantendo o ritmo de leitura.</p>
    <p>→ Terceiro item fecha o ponto.</p>
    <p>Dá para fechar com <strong>uma frase-chave em negrito</strong> para dar peso visual.</p>
  </div>

  <!-- Optional: media block.
       <div class="tweet-media">
         <img src="{{IMAGE_URL}}" alt="Description">
       </div>
  -->
</section>

</body>
</html>

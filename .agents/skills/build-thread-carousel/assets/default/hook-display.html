<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Arquétipo · hook-display</title>
<link rel="stylesheet" href="_carousel.css">
<style>
  /* ============================================================
     Archetype: hook-display
     ============================================================
     When to use: the first slide of the carousel (T1).

     Structure: profile-row + tweet-text with the first paragraph
     set as a HEADLINE (Instrument Serif, regular, 40px), followed by body
     paragraphs at regular weight. Everything vertically centered
     on the slide. Optionally a .tweet-media below.

     The tweet's first sentence gets headline treatment via
     :first-child in the CSS - the user does not need to add a class.

     Practical limit: ~250 chars total. Above that the text competes
     with the generous air that gives it editorial impact.
  */
  .slide-hook .tweet-text > p:first-child {
    font-family: var(--font-serif);
    font-size: 40px;
    font-weight: 400;
    line-height: 1.22;
    letter-spacing: -0.015em;
    margin: 0 0 28px 0;
  }
  .slide-hook .tweet-text > p:not(:first-child) {
    font-size: 30px;
    font-weight: 400;
    line-height: 1.4;
    margin: 0 0 0.85em 0;
    letter-spacing: -0.005em;
  }
  .slide-hook .tweet-text > p:last-child { margin-bottom: 0; }
</style>
</head>
<body class="carrossel-preview">

<section class="slide slide-hook">
  <header class="profile-row">
    <div class="identity">
      <div class="name-line">
        <!-- PNG horizontal 2: dark brown #280e03. Cor por arquivo: tabela em design/identity.md. -->
        <img class="logo" src="../../../../../design/logo/png/horizontal/MIYAKODO_HORIZONTAL2.png" alt="Miyakodo">
        <span class="display-name">Pedro Miyasaki</span>
      </div>
      <div class="bio">@pedro.miyasaki.ia</div>
    </div>
  </header>

  <div class="tweet-text">
    <p>Uma headline direta e forte que vira a pergunta central da thread.</p>
    <p>Um parágrafo de body em peso regular dá contexto à headline ou estica ela.</p>
    <p>Um parágrafo opcional fecha o setup.</p>
  </div>

  <!-- Optional: media block. Omit the whole div if there is no image.
       <div class="tweet-media">
         <img src="{{IMAGE_URL}}" alt="Description">
       </div>
  -->
</section>

</body>
</html>

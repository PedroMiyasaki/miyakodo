<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa: O primeiro projeto de IA</title>
<style>
@font-face {
  font-family: "Instrument Serif";
  src: url("fontes/InstrumentSerif-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "Poppins";
  src: url("fontes/Poppins-Regular.ttf") format("truetype");
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: "Poppins";
  src: url("fontes/Poppins-Medium.ttf") format("truetype");
  font-weight: 500;
  font-style: normal;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body { background: #280e03; }

.slide {
  width: 1920px;
  height: 1080px;
  display: flex;
  overflow: hidden;
  background: #280e03;
  color: #f6f4ee;
}

.panel {
  flex: 1;
  min-width: 0;
  padding: 84px 96px 76px;
  display: flex;
  flex-direction: column;
}

.logo {
  height: 78px;
  width: auto;
  align-self: flex-start;
  display: block;
}

.middle {
  margin-top: auto;
  margin-bottom: auto;
  padding: 48px 0 24px;
}

.kicker {
  font-family: Poppins, sans-serif;
  font-weight: 500;
  font-size: 20px;
  letter-spacing: 0.24em;
  text-transform: uppercase;
  color: #c1c167;
}

h1 {
  margin-top: 22px;
  font-family: "Instrument Serif", serif;
  font-weight: 400;
  font-size: 132px;
  line-height: 0.9;
  letter-spacing: -0.02em;
  color: #f6f4ee;
}

.sub {
  margin-top: 40px;
  font-family: Poppins, sans-serif;
  font-weight: 400;
  font-size: 28px;
  line-height: 1.35;
  color: #f6f4ee;
}

.foot {
  margin-top: auto;
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-top: 28px;
  border-top: 1px solid #aba199;
}

.name,
.meta {
  font-family: Poppins, sans-serif;
  font-size: 24px;
  line-height: 1;
}

.name { font-weight: 500; }

.meta {
  font-weight: 400;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #c1c167;
}

.texture {
  width: 520px;
  height: 1080px;
  flex: none;
  background: #f6f4ee url("textura.jpg") center / cover no-repeat;
}
</style>
</head>
<body>
<section class="slide">
  <div class="panel">
    <img class="logo" src="../../design/logo/png/horizontal/MIYAKODO_HORIZONTAL3.png" alt="Miyakodo">
    <div class="middle">
      <p class="kicker">Webinar ao vivo</p>
      <h1>O primeiro<br>projeto de IA</h1>
      <p class="sub">Onde a inteligência artificial mexe no resultado da empresa.</p>
    </div>
    <div class="foot">
      <p class="name">Pedro Miyasaki</p>
      <p class="meta">2 horas</p>
    </div>
  </div>
  <div class="texture" aria-hidden="true"></div>
</section>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Archetype · hook-display — Reel (X mode)</title>
<link rel="stylesheet" href="_carousel.css">
<style>
  /*
     Archetype: hook-display
     When to use: the first still of the reel (T1).

     The first paragraph becomes a bold 40px HEADLINE.
     The remaining paragraphs are regular 30px body.
  */
  .slide-hook .tweet-text > p:first-child {
    font-size: 40px;
    font-weight: 700;
    line-height: 1.22;
    letter-spacing: -0.015em;
    margin: 0 0 28px 0;
  }
  .slide-hook .tweet-text > p:not(:first-child) {
    font-size: 30px;
    font-weight: 400;
    line-height: 1.4;
    margin: 0 0 0.85em 0;
    letter-spacing: -0.005em;
  }
  .slide-hook .tweet-text > p:last-child { margin-bottom: 0; }
</style>
</head>
<body class="carrossel-preview">

<section class="slide slide-hook">
  <header class="profile-row">
    <img class="avatar" src="{{AVATAR_URL}}" alt="{{NAME}}">
    <div class="identity">
      <div class="name-line">
        <span class="display-name">{{NAME}}</span>
        <svg class="verified" viewBox="0 0 24 24" aria-label="Verified account" role="img">
          <g>
            <path fill="#1d9bf0" d="M22.25 12c0-1.43-.88-2.67-2.19-3.34.46-1.39.2-2.9-.81-3.91s-2.52-1.27-3.91-.81c-.66-1.31-1.91-2.19-3.34-2.19s-2.67.88-3.33 2.19c-1.4-.46-2.91-.2-3.92.81s-1.26 2.52-.8 3.91c-1.31.67-2.2 1.91-2.2 3.34s.89 2.67 2.2 3.34c-.46 1.39-.21 2.9.8 3.91s2.52 1.26 3.91.81c.67 1.31 1.91 2.19 3.34 2.19s2.68-.88 3.34-2.19c1.39.45 2.9.2 3.91-.81s1.27-2.52.81-3.91c1.31-.67 2.19-1.91 2.19-3.34z"/>
            <path fill="#ffffff" d="M10.54 16.2L6.8 12.46l1.41-1.42 2.26 2.26 4.8-5.23 1.47 1.36-6.2 6.77z"/>
          </g>
        </svg>
      </div>
      <div class="bio">{{HANDLE}}</div>
    </div>
  </header>

  <div class="tweet-text">
    <p>A bold, direct headline that becomes the thread's core question.</p>
    <p>A regular-weight body paragraph gives context to the headline or stretches it.</p>
  </div>

  <!-- Optional: media block. Omit the whole div if there is no image.
       <div class="tweet-media">
         <img src="{{IMAGE_URL}}" alt="Description">
       </div>
  -->
</section>

</body>
</html>

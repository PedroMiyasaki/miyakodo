<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><style>@font-face{font-family:"Bricolage Grotesque";src:url("../fonts/bricolage-grotesque-latin-wght-normal.woff2") format("woff2");font-weight:200 800;font-style:normal}@font-face{font-family:"Inter";src:url("../fonts/inter-latin-wght-normal.woff2") format("woff2");font-weight:100 900;font-style:normal}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#555}
.grao::after{content:"";position:absolute;inset:0;z-index:9;pointer-events:none;background-image:radial-gradient(currentColor .5px,transparent .6px);background-size:4px 4px;opacity:.05}

.folha{width:2160px;padding:27px;display:grid;grid-template-columns:repeat(7,270px);gap:36px;background:#D9D9D9}
.folha figure{margin:0}
.folha img{display:block;width:270px;height:480px;outline:1px solid #0A0A0A}
.folha figcaption{margin-top:14px;font-family:"Inter",system-ui,sans-serif;font-weight:500;font-size:22px;line-height:1.3;letter-spacing:.04em;text-transform:uppercase;color:#0A0A0A}
</style></head><body><svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<filter id="rough" x="-25%" y="-25%" width="150%" height="150%">
  <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<filter id="rough2" x="-25%" y="-25%" width="150%" height="150%">
  <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="4" result="n"/>
  <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
</filter>
<pattern id="ht-dark" width="11" height="11" patternUnits="userSpaceOnUse">
  <circle cx="5.5" cy="5.5" r="2.1" fill="#0A0A0A"/>
</pattern>
<marker id="seta" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="40" markerHeight="40" markerUnits="userSpaceOnUse" orient="auto">
  <path d="M0 0 L10 5 L0 10 Z" fill="#0A0A0A"/>
</marker>
</defs></svg><main class="folha" id="alvo"><figure><img src="../../plano/take-01.png" alt=""><figcaption>01 · Gancho<br>00:00.0 a 00:05.0</figcaption></figure><figure><img src="../../plano/take-02.png" alt=""><figcaption>02 · Corretagem<br>00:05.0 a 00:08.5</figcaption></figure><figure><img src="../../plano/take-03.png" alt=""><figcaption>03 · Contabilidade<br>00:08.5 a 00:12.0</figcaption></figure><figure><img src="../../plano/take-04.png" alt=""><figcaption>04 · Saúde<br>00:12.0 a 00:15.5</figcaption></figure><figure><img src="../../plano/take-05.png" alt=""><figcaption>05 · Sinistros<br>00:15.5 a 00:19.0</figcaption></figure><figure><img src="../../plano/take-06.png" alt=""><figcaption>06 · Tributária<br>00:19.0 a 00:22.5</figcaption></figure><figure><img src="../../plano/take-07.png" alt=""><figcaption>07 · CTA<br>00:22.5 a 00:27.5</figcaption></figure></main></body></html>

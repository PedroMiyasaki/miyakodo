<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face {
  font-family: "Bricolage Grotesque";
  src: url("bricolage-800.woff2") format("woff2");
  font-weight: 800;
  font-style: normal;
}
@font-face {
  font-family: Inter;
  src: url("inter-500.woff2") format("woff2");
  font-weight: 500;
  font-style: normal;
}
html, body { margin: 0; width: 1080px; height: 1920px; background: #0A0A0A; }
.slide {
  position: relative;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background: #0A0A0A;
  color: #FFFFFF;
}
.slide::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(currentColor .5px, transparent .6px);
  background-size: 4px 4px;
  opacity: .05;
}
.mark {
  position: absolute;
  top: 88px;
  left: 88px;
  z-index: 1;
  margin: 0;
  font: 500 22px/1 Inter, sans-serif;
  letter-spacing: .18em;
  text-transform: uppercase;
  opacity: .55;
}
.hook {
  position: absolute;
  left: 88px;
  right: 88px;
  top: 50%;
  z-index: 1;
  margin: 0;
  transform: translateY(-50%);
  font-family: "Bricolage Grotesque", sans-serif;
  font-weight: 800;
  font-size: 128px;
  letter-spacing: -0.025em;
  line-height: 0.94;
}
</style>
</head>
<body>
<section class="slide">
  <p class="mark">@pedro.miyasaki.ia</p>
  <h1 class="hook">O hype da IA<br>está te<br>atrapalhando.</h1>
</section>
</body>
</html>

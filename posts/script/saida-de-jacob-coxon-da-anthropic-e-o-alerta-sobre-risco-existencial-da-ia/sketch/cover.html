<style>
@import url('https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&family=Inter:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap');

:root{
  --paper:#FFFFFF; --ink:#0A0A0A;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --read:"Newsreader",Georgia,serif;
  --pad:88px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#555;display:flex;flex-wrap:wrap;gap:40px;padding:40px;justify-content:center}

.slide{
  position:relative;width:1080px;height:1350px;overflow:hidden;
  padding:var(--pad);background:var(--paper);color:var(--ink);
  display:flex;flex-direction:column;
}
.slide.inv{background:var(--ink);color:var(--paper)}
.slide::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:9;
  background-image:radial-gradient(currentColor .5px,transparent .6px);
  background-size:4px 4px;opacity:.05;
}
/* the handle mark - every slide, no exceptions */
.mark{font:500 22px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;opacity:.55}

.hook{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:.94;font-size:104px;margin-top:52px;text-wrap:balance}
.hl{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:.94;font-size:86px;margin-top:52px;text-wrap:balance}
.bd{font:400 46px/1.32 var(--body);max-width:30ch;margin-top:34px}
.cta{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:.94;font-size:118px;text-align:center;text-wrap:balance}
.art{margin-top:auto;display:flex;justify-content:center;align-items:flex-end}

/* rule set device */
.rt{height:9px;background:currentColor}
.rb{height:3px;background:currentColor}

/* block label device */
.blab{
  display:inline-block;background:currentColor;filter:url(#rough-sm);
  font:500 26px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;padding:14px 20px;
}
.blab span{color:var(--paper)}
.inv .blab span,.half.inv .blab span{color:var(--ink)}

/* 03 quote */
.q-wrap{flex:1;display:flex;flex-direction:column;justify-content:center;gap:44px}
.q-txt{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:1.0;font-size:82px;text-wrap:balance}
.q-att{font:500 26px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;opacity:.55}

/* 04 data */
.d-wrap{flex:1;display:flex;flex-direction:column;justify-content:center}
.d-fig{font-family:var(--display);font-weight:800;letter-spacing:-.045em;line-height:.82;font-size:300px}
.d-lab{font:500 34px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;margin-top:26px;opacity:.6}
.d-ctx{font:400 42px/1.32 var(--body);max-width:26ch;margin-top:40px}

/* 05 list */
.l-items{margin-top:56px;display:flex;flex-direction:column}
.l-item{display:flex;gap:32px;align-items:baseline;padding:30px 0;border-top:2px solid currentColor}
.l-item:last-child{border-bottom:2px solid currentColor}
.l-n{font-family:var(--display);font-weight:800;font-size:52px;letter-spacing:-.03em;opacity:.32;min-width:74px}
.l-t{font:400 42px/1.24 var(--body);flex:1}

/* 06 split */
.slide.split{padding:0;flex-direction:column}
.half{flex:1;padding:var(--pad);display:flex;flex-direction:column;position:relative}
.half.inv{background:var(--ink);color:var(--paper)}
.half .ht{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:.96;font-size:64px;margin-top:26px;text-wrap:balance}
.half .hb{font:400 34px/1.3 var(--body);max-width:32ch;margin-top:20px;opacity:.85}

/* 07 reading */
.r-hl{font-family:var(--display);font-weight:800;letter-spacing:-.025em;line-height:.98;font-size:56px;margin-top:48px}
.r-txt{font:400 40px/1.42 var(--read);max-width:38ch;margin-top:38px}
.r-txt em{font-style:italic}
.r-txt p+p{margin-top:26px}
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="rough" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough2" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="rough-sm" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.042" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ht-dark" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="2.1" fill="#0A0A0A"/></pattern>
    <pattern id="ht-light" width="11" height="11" patternUnits="userSpaceOnUse"><circle cx="5.5" cy="5.5" r="2.1" fill="#FFFFFF"/></pattern>
  </defs>
</svg>


<style>
  /* 9:16 override - the archetype is 1080x1350 and the PNG comes from the
     element's own CSS box, so --width/--height alone would still render 4:5. */
  body{background:#555;padding:40px}
  .slide{height:1920px}
  /* the grid crops back to the central 1080x1350 (y 285..1635): hook, support line and art sit
     inside that band. Only the mark stays out in the bleed. */
  .hook{margin-top:400px}
  .art{margin-top:100px;justify-content:flex-start}
</style>

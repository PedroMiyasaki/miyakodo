<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>IA no trabalho de especialistas · Figuras</title><style>
:root{
  --paper:#FFFFFF;
  --ink:#0A0A0A;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Inter",system-ui,sans-serif;
  --pad:88px;
}

*{margin:0;padding:0;box-sizing:border-box}
body{background:#555;display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px}

.slide{
  position:relative;
  width:1080px;height:1350px;
  overflow:hidden;
  padding:var(--pad);
  background:var(--paper);
  color:var(--ink);
  display:flex;flex-direction:column;
}
.slide.inv{background:var(--ink);color:var(--paper)}

/* paper grain */
.slide::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(currentColor .5px,transparent .6px);
  background-size:4px 4px;opacity:.05;
}

.mark{
  font:500 22px/1 var(--body);
  letter-spacing:.18em;text-transform:uppercase;
  opacity:.55;
}

.hl{
  font-family:var(--display);font-weight:800;
  letter-spacing:-.025em;line-height:.94;
  margin-top:56px;
}
.cover .hl{font-size:104px}
.body-slide .hl{font-size:86px}
.cta .hl{font-size:118px;text-align:center}

.sub{
  font:400 46px/1.32 var(--body);
  margin-top:36px;max-width:30ch;
}
.cta .sub{text-align:center;margin:36px auto 0;max-width:26ch}

.art{margin-top:auto;display:flex;justify-content:center;align-items:flex-end}
.cover .art{justify-content:flex-start}
</style>

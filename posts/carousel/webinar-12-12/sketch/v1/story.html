<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webinar 12/12 · story v1</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Poppins:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
  :root {
    --off: #f6f4ee;
    --ink: #280e03;
    --gray: #aba199;
    --green: #1a3010;
    --accent: #db3c05;
    --serif: "Instrument Serif", "Times New Roman", serif;
    --sans: Poppins, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #6e675f;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    padding: 36px;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    padding: 120px 84px 110px;
  }

  .logo { height: 112px; width: auto; display: block; }

  .handle {
    margin-top: 16px;
    font-family: var(--sans);
    font-size: 24px;
    font-weight: 500;
    color: var(--gray);
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 0.94;
  }

  h1 em { font-style: italic; }

  .dark { background: var(--ink); color: var(--off); }
  .light { background: var(--off); color: var(--ink); }
  .green { background: var(--green); color: var(--off); }

  .s1 h1 {
    margin-top: 180px;
    font-size: 118px;
    max-width: 8.4em;
  }

  .rule {
    width: 112px;
    height: 8px;
    margin-top: 56px;
    background: var(--accent);
    border: 0;
  }

  .mascot {
    position: absolute;
    width: 520px;
    right: 48px;
    bottom: 160px;
  }

  .s2 h1 {
    margin-top: 280px;
    font-size: 108px;
    max-width: 9em;
  }

  .s3 .when {
    margin-top: 220px;
    font-family: var(--serif);
    font-size: 168px;
    line-height: 0.86;
    letter-spacing: -0.035em;
  }

  .s3 .when em {
    display: block;
    margin-top: 12px;
    font-size: 104px;
    font-style: italic;
    color: var(--accent);
  }

  .lines {
    margin-top: 64px;
    font-family: var(--sans);
    font-size: 42px;
    font-weight: 400;
    line-height: 1.35;
  }

  .arrow {
    margin-top: auto;
    font-family: var(--sans);
    font-size: 34px;
    font-weight: 500;
  }
</style>
</head>
<body>

<section class="slide dark s1">
  <img class="logo" src="../../../../../design/logo/png/horizontal/MIYAKODO_HORIZONTAL3.png" alt="Miyakodo">
  <div class="handle">@pedro.miyasaki.ia</div>
  <h1>A IA da empresa<br>ainda é um <em>chat.</em></h1>
  <hr class="rule">
  <img class="mascot" src="../../../../../design/mascote-e-textura/png/MASCOTE_5.png" alt="">
</section>

<section class="slide light s2">
  <img class="logo" src="../../../../../design/logo/png/horizontal/MIYAKODO_HORIZONTAL2.png" alt="Miyakodo">
  <div class="handle">@pedro.miyasaki.ia</div>
  <h1>Pesquisa e texto não são o projeto.</h1>
</section>

<section class="slide green s3">
  <img class="logo" src="../../../../../design/logo/png/horizontal/MIYAKODO_HORIZONTAL3.png" alt="Miyakodo">
  <div class="handle">@pedro.miyasaki.ia</div>
  <p class="when">12/12, <em>ao vivo.</em></p>
  <p class="lines">Duas horas.<br>Roadmap do primeiro projeto.</p>
  <p class="arrow">Link na seta.</p>
</section>

</body>
</html>

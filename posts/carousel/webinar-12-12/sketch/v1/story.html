<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Webinar 12/12 · story</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Poppins:wght@400&display=swap">
<style>
  :root {
    --off: #f6f4ee;
    --ink: #280e03;
    --mark: #d39ca7;
    --serif: "Instrument Serif", "Times New Roman", serif;
    --sans: Poppins, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #6e675f;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 36px;
    padding: 36px;
  }

  .slide {
    width: 1080px;
    height: 1920px;
    position: relative;
    overflow: hidden;
    background: var(--off);
    color: var(--ink);
    padding: 220px 80px 120px;
    display: flex;
    flex-direction: column;
  }

  .logo {
    position: absolute;
    top: 72px;
    right: 72px;
    width: 120px;
    height: auto;
    object-fit: contain;
    display: block;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 92px;
    line-height: 1.02;
    letter-spacing: -0.02em;
    text-transform: uppercase;
    max-width: 11em;
  }

  .mark {
    background: var(--mark);
    color: var(--ink);
    box-decoration-break: clone;
    -webkit-box-decoration-break: clone;
    padding: 0.04em 0.14em 0.08em;
  }

  .body {
    margin-top: 48px;
    max-width: 16em;
    font-family: var(--sans);
    font-weight: 400;
    font-size: 40px;
    line-height: 1.35;
  }

  .mascot {
    position: absolute;
    width: 460px;
    height: auto;
    right: 48px;
    bottom: 80px;
    object-fit: contain;
  }
</style>
</head>
<body>

<section class="slide">
  <img class="logo" src="../../../../../design/logo/png/vertical/MIYAKODO_VERTICAL2.png" alt="Miyakodo">
  <h1>A IA da sua<br>empresa ainda<br><span class="mark">é um chat?</span></h1>
  <img class="mascot" src="../../../../../design/mascote-e-textura/png/MASCOTE_4.png" alt="">
</section>

<section class="slide">
  <img class="logo" src="../../../../../design/logo/png/vertical/MIYAKODO_VERTICAL2.png" alt="Miyakodo">
  <h1>Chat não muda o<br><span class="mark">resultado da<br>sua empresa.</span></h1>
  <p class="body">Texto para editar.</p>
</section>

<section class="slide">
  <img class="logo" src="../../../../../design/logo/png/vertical/MIYAKODO_VERTICAL2.png" alt="Miyakodo">
  <h1>Quer saber como<br><span class="mark">mudar isso?</span></h1>
  <p class="body">Dia 12 de dezembro, ao vivo.<br>Texto para editar.</p>
  <img class="mascot" src="../../../../../design/mascote-e-textura/png/MASCOTE_5.png" alt="">
</section>

</body>
</html>
